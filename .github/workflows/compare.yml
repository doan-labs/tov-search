# Head to head on one Mac: tov-search (Tov and Rust), upstream fsearch and
# fff, timed on the same files and keystrokes by compare/compare.py.
# fsearch only builds on macOS, so this runs on a Blacksmith M4.
name: compare
# PRs and manual runs only, never on pushes to main.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # Docs-only changes don't touch the engine.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  compare:
    # Same gate as tov.yml: no drafts, outside PRs need a fresh ci-approved label.
    if: >-
      github.event_name != 'pull_request' || (!github.event.pull_request.draft
      && ((github.event.action == 'labeled' && github.event.label.name == 'ci-approved')
      || (github.event.action != 'labeled'
      && (contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)
      || contains(fromJSON(vars.CI_TRUSTED || '[]'), github.event.pull_request.user.login)))))
    runs-on: blacksmith-6vcpu-macos-15
    env:
      TOV_PIN: ba81eb0d9cffe745411cafdd112c59d86cd7deb8
      LINUX_SHA: a5ebb76233b79db01e82e061173cb73c6d2b5c6b
      # Every Rust build tuned for this CPU, like rust/build.sh does for ours.
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: rust
        run: |
          command -v cargo >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/tov
            ~/.tov/src
          key: tov-${{ env.TOV_PIN }}-macos
      - name: tov at the pinned commit
        run: |
          [ -x "$HOME/.cargo/bin/tov" ] && exit 0
          git init -q ~/.tov/src
          git -C ~/.tov/src fetch -q --depth 1 https://github.com/richiemcilroy/Tov "$TOV_PIN"
          git -C ~/.tov/src checkout -q FETCH_HEAD
          cargo install -q --locked --path ~/.tov/src/crates/tov
      - name: build the engines
        run: |
          tov/build.sh simd par
          rust/build.sh
          cargo build --release -q --manifest-path compare/fsearch-engine/Cargo.toml
          cargo build --release -q --manifest-path compare/fff-engine/Cargo.toml
      - name: the 10M-entry benchmark disk
        run: cd rust/bench && cargo build --release -q && target/release/bench gen
      - name: the Linux kernel tree
        run: |
          # A case-sensitive volume: some kernel paths differ only by case.
          hdiutil create -quiet -size 8g -type SPARSE -fs 'Case-sensitive APFS' -volname corpus "$RUNNER_TEMP/corpus"
          hdiutil attach -quiet -mountpoint "$RUNNER_TEMP/vol" "$RUNNER_TEMP/corpus.sparseimage"
          mkdir "$RUNNER_TEMP/vol/linux"
          curl -fsSL "https://codeload.github.com/torvalds/linux/tar.gz/$LINUX_SHA" | tar -xz -C "$RUNNER_TEMP/vol/linux" --strip-components 1
          python3 compare/compare.py mkdisk "$RUNNER_TEMP/vol/linux" "$RUNNER_TEMP/linux.bin"
      - name: compare
        run: |
          set -o pipefail
          {
            echo "Each engine runs with its own defaults: fff crawls the tree and indexes files only,"
            echo "skipping hidden and gitignored ones; the others load a disk file of every file and folder."
            echo
            # Never the dev trace: tov is tuned on it. Holdout, plus queries no one has seen before.
            python3 compare/compare.py gen rust/bench/data/disk.bin "$RUNNER_TEMP/random.txt" --seed "$GITHUB_RUN_ID" >/dev/null
            for t in rust/bench/traces/holdout.txt "$RUNNER_TEMP/random.txt"; do
              echo "## 10M-entry benchmark disk, $(basename "$t") (fff can't load a disk file)"
              [ "$t" = rust/bench/traces/holdout.txt ] || echo "Random queries: \`compare.py gen --seed $GITHUB_RUN_ID\`."
              python3 compare/compare.py run "$t" --disk rust/bench/data/disk.bin \
                --engine tov=tov/build/engine-simd-par --engine rust=rust/bin/engine \
                --engine fsearch=compare/fsearch-engine/target/release/fsearch-engine
              echo
            done
            echo "## Linux kernel tree"
            echo "$(python3 -c 'import sys; print(int.from_bytes(open(sys.argv[1], "rb").read()[8:16], "little"))' "$RUNNER_TEMP/linux.bin") entries in the disk file."
            # 2>&1: fff-engine reports how many files it indexed.
            python3 compare/compare.py run compare/linux.tsv --disk "$RUNNER_TEMP/linux.bin" --dir "$RUNNER_TEMP/vol/linux" \
              --engine tov=tov/build/engine-simd-par --engine rust=rust/bin/engine \
              --engine fsearch=compare/fsearch-engine/target/release/fsearch-engine \
              --dir-engine fff=compare/fff-engine/target/release/fff-engine 2>&1
          } | tee -a "$GITHUB_STEP_SUMMARY"
