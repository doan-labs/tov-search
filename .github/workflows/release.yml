# Push a tag like v0.1.0: builds tov-search for Apple Silicon and for Linux
# (x86_64, aarch64) and attaches them to the tag's GitHub release. Run it by
# hand to rebuild an older tag.
# Homebrew doesn't see it until you run rust/tools/brew.sh <tag> (see the
# Release section of rust/README.md).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Apple Silicon Mac, not just the build machine's CPU.
          - { target: aarch64-apple-darwin, os: blacksmith-6vcpu-macos-15, cpu: apple-m1 }
          # Ubuntu 22.04's glibc, so the binary runs on older distros too.
          # x86-64-v3 is AVX2 (Haswell, 2013, and later).
          - { target: x86_64-unknown-linux-gnu, os: blacksmith-4vcpu-ubuntu-2204, cpu: x86-64-v3 }
          - { target: aarch64-unknown-linux-gnu, os: blacksmith-4vcpu-ubuntu-2204-arm, cpu: generic }
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARBALL: tov-search-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: rust
        run: |
          command -v cargo >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$TARBALL" -C rust/target/release tov-search
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          # The three jobs race to create the release; one wins.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" --clobber "$TARBALL" "$TARBALL.sha256"
