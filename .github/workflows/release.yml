# Push a tag like v0.1.0: builds tov-search for Apple Silicon and attaches it
# to the tag's GitHub release. Run it by hand to rebuild an older tag.
# Homebrew doesn't see it until you run rust/tools/brew.sh <tag> (see the
# Release section of rust/README.md).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-6vcpu-macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARBALL: tov-search-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: rust
        run: |
          command -v cargo >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Every Apple Silicon Mac, not just the build machine's CPU.
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml
        env:
          RUSTFLAGS: -C target-cpu=apple-m1
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$TARBALL" -C rust/target/release tov-search
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" --clobber "$TARBALL" "$TARBALL.sha256"
